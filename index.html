          <article aria-labelledby="closetiq-title">
            <h3 id="closetiq-title">ClosetIQ</h3>
            <p>Full stack &middot; Public deployment</p>
            <p>
              A personal wardrobe application for organizing clothes, building outfits, and keeping
              everyday clothing routines in order.
            </p>
            <p>
              ClosetIQ brings a personal wardrobe into one application: organize garments, track
              what is clean or in the laundry, and build outfits from existing clothes. Its React
              interface connects to a TypeScript and Express API, while PostgreSQL and Prisma
              organize each user&rsquo;s clothing, outfits, and wear history. A rule-based stylist
              suggests combinations from clean items for different occasions.
            </p>
            <p>
              Technologies: React, Vite, TypeScript, CSS, Node.js, Express, PostgreSQL, Prisma,
              Cloudinary.
            </p>
            <h4>Implemented features</h4>
            <ul>
              <li>Session-based accounts with per-user wardrobe data</li>
              <li>Clothing catalog with search, filters, favorites, and image uploads</li>
              <li>Clean, worn, and laundry states with wear tracking</li>
              <li>Create, edit, and save outfits from existing garments</li>
              <li>Wardrobe statistics and most-worn item insights</li>
              <li>Rule-based outfit suggestions for casual, work, school, and formal occasions</li>
            </ul>
            <p>
              Public entry verified. Features are documented from source; protected workflows were
              not exercised. The source repository is private.
            </p>
            <p><a href="https://closet-iq.onrender.com">Visit ClosetIQ live demo</a></p>
          </article>
